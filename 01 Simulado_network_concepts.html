<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulado CompTIA Network+</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#172033}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 18px #00000012}.top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.stat{flex:1;min-width:120px;background:#f7f9fc;border-radius:12px;padding:12px;text-align:center}.num{font-size:25px;font-weight:700}.label{font-size:13px;color:#687386}.progress{height:9px;background:#e8edf4;border-radius:9px;overflow:hidden;margin:10px 0 20px}.bar{height:100%;width:0;background:#2563eb;transition:.2s}.qnum{color:#2563eb;font-weight:700;margin-bottom:8px}.question{font-size:19px;line-height:1.5;white-space:pre-wrap;text-align:justify}.opt{display:block;margin:11px 0;padding:14px;border:2px solid #dfe5ee;border-radius:11px;cursor:pointer}.opt:hover{border-color:#9db9ed}.opt input{margin-right:10px}.opt{text-align:justify}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#e9eef5;color:#172033}.danger{background:#dc2626;color:#fff}.success{background:#16a34a;color:#fff}.feedback{margin-top:15px;padding:14px;border-radius:10px;font-weight:700}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.result{text-align:center}.result .big{font-size:36px;font-weight:800}.hidden{display:none}.small{font-size:13px;color:#64748b}</style></head><body><div class="wrap"><div class="card" id="app"></div></div><script>const DATA={"questions":[{"n":1,"q":"Um técnico conecta dois computadores utilizando um cabo Ethernet. Os equipamentos não conseguem detectar nenhum sinal no meio físico. Qual elemento está diretamente relacionado à Camada Física (Physical Layer)?","options":{"A":"Endereço MAC","B":"Endereço IP","C":"Sinal elétrico transmitido pelo cabo","D":"Número da porta TCP"}},{"n":2,"q":"Um administrador verifica uma conexão Ethernet e observa que os equipamentos conseguem transmitir sinais pelo cabo, mas existe um problema na negociação da velocidade e do modo de transmissão. A interface está configurada para 100 Mbps, enquanto o equipamento conectado está operando em 1 Gbps. Qual conceito está mais diretamente relacionado à Camada Física nesse cenário?","options":{"A":"Endereçamento MAC","B":"Características de transmissão do meio físico","C":"Roteamento IP","D":"Controle de fluxo TCP"}},{"n":3,"q":"Uma empresa possui um enlace Ethernet entre dois switches. O enlace apresenta perda intermitente de conectividade. Após vários testes, o administrador constata que: • Os endereços MAC estão corretos; • As VLANs estão corretamente configuradas; • Os endereços IP estão corretos; • Não existem erros de roteamento; • A interface apresenta CRC errors e input errors; • Ao substituir o cabo, os erros desaparecem. Qual conclusão é mais adequada?","options":{"A":"O problema está na Camada 3, pois os pacotes IP estão sendo descartados.","B":"O problema está na Camada 2, pois os frames apresentam erros de CRC.","C":"O problema provavelmente está relacionado à Camada 1, pois existe uma falha no meio físico causando corrupção dos sinais transmitidos.","D":"O problema está na Camada 4, pois o TCP precisa retransmitir os dados."}},{"n":4,"q":"Um administrador conecta vários computadores a um switch Ethernet. Para encaminhar os frames para a porta correta, o switch utiliza informações presentes na tabela de endereços MAC. Qual camada do modelo OSI está diretamente relacionada a essa função?","options":{"A":"Camada Física","B":"Camada de Enlace de Dados","C":"Camada de Rede","D":"Camada de Transporte"}},{"n":5,"q":"Uma empresa precisa separar logicamente diferentes grupos de usuários dentro da mesma infraestrutura física de switches. Os computadores do setor Financeiro não devem pertencer ao mesmo domínio lógico de Camada 2 dos computadores do setor Administrativo. Qual recurso atende diretamente a essa necessidade?","options":{"A":"VLAN","B":"NAT","C":"DHCP","D":"DNS"}},{"n":6,"q":"Um administrador está investigando uma comunicação Ethernet entre dois switches. Os equipamentos estão conectados fisicamente e conseguem trocar sinais, porém alguns frames chegam ao destino com conteúdo corrompido. O switch receptor identifica a inconsistência por meio de um mecanismo de verificação de integridade presente no frame. Qual alternativa descreve melhor a função envolvida?","options":{"A":"O endereço IP de destino é utilizado para verificar a integridade do pacote.","B":"O TCP utiliza números de sequência para detectar o problema no frame Ethernet.","C":"O FCS (Frame Check Sequence) é utilizado para detectar erros no frame na Camada de Enlace.","D":"O DNS verifica o conteúdo do frame e solicita sua retransmissão."}},{"n":7,"q":"Um roteador recebe um pacote IP destinado a uma rede diferente daquela em que o pacote foi originado. Para decidir por qual interface deve encaminhar o pacote, o roteador consulta sua tabela de roteamento. Qual camada do modelo OSI está diretamente envolvida?","options":{"A":"Física","B":"Enlace de Dados","C":"Rede","D":"Transporte"}},{"n":8,"q":"Um administrador possui duas redes: • 192.168.10.0/24 • 192.168.20.0/24 Um computador da primeira rede precisa acessar um servidor localizado na segunda rede. Qual dispositivo é responsável por encaminhar o tráfego entre essas duas redes?","options":{"A":"Hub","B":"Switch Layer 2","C":"Roteador","D":"Repetidor"}},{"n":9,"q":"Um computador possui o endereço: 192.168.10.25/24 Seu gateway padrão é: 192.168.10.1 O computador tenta acessar: 192.168.20.50. O administrador verifica que o endereço MAC do servidor remoto não aparece na tabela ARP do computador. Porém, o computador consegue acessar normalmente outros dispositivos da rede 192.168.10.0/24. Qual é a explicação mais adequada?","options":{"A":"O computador deve descobrir o MAC de 192.168.20.50 usando ARP antes de enviar o pacote.","B":"O computador deve enviar o pacote ao seu gateway padrão, pois 192.168.20.50 está em outra rede IP.","C":"O switch deve encaminhar o frame diretamente para 192.168.20.50 usando seu endereço MAC.","D":"O computador deve utilizar broadcast para localizar 192.168.20.50 em qualquer rede IP."}},{"n":10,"q":"Um administrador precisa identificar qual protocolo de transporte oferece comunicação confiável, utilizando confirmação de recebimento e retransmissão quando necessário. Qual protocolo atende a esse requisito?","options":{"A":"UDP","B":"TCP","C":"ICMP","D":"ARP"}},{"n":11,"q":"Um servidor web recebe simultaneamente conexões de centenas de clientes. Para identificar corretamente qual aplicação/processo deve receber cada fluxo de dados, o sistema utiliza números associados às conexões. Qual recurso da Camada de Transporte permite essa identificação?","options":{"A":"Endereço MAC","B":"Endereço IP","C":"Número de porta","D":"Endereço de broadcast"}},{"n":12,"q":"Um aplicativo envia uma grande quantidade de dados utilizando TCP. Durante a transmissão, alguns segmentos são perdidos. O receptor informa ao remetente quais dados foram recebidos, e o remetente retransmite os segmentos que não foram confirmados. Qual conjunto de mecanismos da Camada de Transporte está diretamente relacionado a esse comportamento?","options":{"A":"Endereçamento MAC, FCS e VLAN","B":"ACK, números de sequência e retransmissão","C":"ARP, gateway padrão e tabela de roteamento","D":"DNS, DHCP e resolução de nomes"}},{"n":13,"q":"Durante uma comunicação entre dois sistemas, é necessário estabelecer uma sessão de comunicação, mantê-la ativa durante a troca de dados e encerrá-la quando a comunicação terminar. Qual camada do modelo OSI está diretamente relacionada a essas funções?","options":{"A":"Física","B":"Transporte","C":"Sessão","D":"Apresentação"}},{"n":14,"q":"Uma aplicação está realizando uma transferência de dados muito longa. Para facilitar a recuperação caso ocorra uma interrupção, a comunicação é dividida logicamente em pontos de sincronização. Se a conexão for interrompida, a aplicação pode retomar a comunicação a partir de determinado ponto, em vez de reiniciar todo o processo. Qual função da Camada de Sessão está sendo representada?","options":{"A":"Endereçamento lógico","B":"Controle de diálogo e sincronização","C":"Controle de fluxo TCP","D":"Enquadramento Ethernet"}},{"n":15,"q":"Uma aplicação corporativa mantém uma comunicação prolongada com um sistema remoto. Durante a comunicação, existem mecanismos para controlar quem pode transmitir em determinado momento, estabelecer pontos de sincronização e coordenar o início e o término da interação entre as aplicações. O administrador precisa identificar qual função do modelo OSI está mais associada a esse comportamento. Qual alternativa está correta?","options":{"A":"A Camada de Transporte, pois controla exclusivamente a sessão e define quando as aplicações podem iniciar ou terminar a comunicação.","B":"A Camada de Rede, pois o roteamento determina a ordem e a sincronização dos diálogos entre aplicações.","C":"A Camada de Sessão, pois ela pode estabelecer, gerenciar, sincronizar e encerrar sessões, além de coordenar o diálogo.","D":"A Camada de Apresentação, pois criptografia e compressão determinam qual aplicação pode transmitir primeiro."}},{"n":16,"q":"Uma aplicação precisa receber dados que foram codificados em um formato diferente daquele utilizado internamente pelo sistema. É necessário converter os dados para que a aplicação consiga interpretá-los corretamente. Qual camada do modelo OSI está mais diretamente relacionada a essa função?","options":{"A":"Física","B":"Transporte","C":"Apresentação","D":"Sessão"}},{"n":17,"q":"Uma empresa transmite documentos entre dois sistemas. Para reduzir o tamanho dos dados enviados pela rede, o sistema realiza compressão antes da transmissão e descompressão quando os dados chegam ao destino. Qual camada do modelo OSI está associada a essa função?","options":{"A":"Camada de Enlace","B":"Camada de Rede","C":"Camada de Sessão","D":"Camada de Apresentação"}},{"n":18,"q":"Uma aplicação envia informações confidenciais para outro sistema. Antes da transmissão, os dados são convertidos para uma representação apropriada, comprimidos e criptografados. No destino, ocorre o processo inverso para que a aplicação possa utilizar os dados. Considerando o modelo OSI tradicional, qual camada está mais diretamente associada a esse conjunto de funções?","options":{"A":"Camada de Sessão","B":"Camada de Apresentação","C":"Camada de Transporte","D":"Camada de Aplicação"}},{"n":19,"q":"Um usuário abre o navegador e acessa: https://comptia.org. Qual camada do modelo OSI está associada diretamente ao serviço/protocolo utilizado pela aplicação para realizar essa comunicação?","options":{"A":"Física","B":"Transporte","C":"Aplicação","D":"Rede"}},{"n":20,"q":"Um computador consegue acessar servidores pelo endereço IP, como 10.10.20.50, mas não consegue acessar servidor.comptia.local. O administrador verifica que a conectividade IP está funcionando normalmente. Qual serviço/protocolo da Camada de Aplicação deve ser investigado primeiro?","options":{"A":"DHCP","B":"DNS","C":"SNMP","D":"FTP"}},{"n":21,"q":"Um servidor web está funcionando corretamente. Um usuário acessa https://sistema.comptia.local e a conexão TCP é estabelecida normalmente na porta 443. Entretanto, o navegador recebe uma resposta indicando que o recurso solicitado não foi encontrado. Considerando o modelo OSI, qual camada está mais diretamente relacionada ao protocolo responsável pela solicitação desse recurso?","options":{"A":"Camada 3 — Rede","B":"Camada 4 — Transporte","C":"Camada 6 — Apresentação","D":"Camada 7 — Aplicação"}},{"n":22,"q":"Uma empresa possui duas redes diferentes: • Rede A: 192.168.10.0/24 • Rede B: 192.168.20.0/24 Os computadores da Rede A precisam se comunicar com os computadores da Rede B. Qual dispositivo é responsável por encaminhar o tráfego entre essas redes?","options":{"A":"Switch","B":"Hub","C":"Roteador","D":"Access Point"}},{"n":23,"q":"Um computador 192.168.10.25/24 precisa acessar um servidor 192.168.20.50/24. Ao verificar a tabela ARP, o administrador percebe que o computador não possui o MAC address do servidor. O que o computador deve fazer para encaminhar corretamente o pacote?","options":{"A":"Enviar um ARP diretamente procurando o MAC do servidor remoto.","B":"Enviar o pacote diretamente para o switch, que descobrirá o caminho até o servidor.","C":"Descobrir via ARP o MAC do seu gateway padrão e encaminhar o pacote para o roteador.","D":"Fazer broadcast do pacote para todas as redes até encontrar o servidor."}},{"n":24,"q":"Um roteador possui a seguinte tabela de roteamento: Rede de destino Próximo salto 10.0.0.0/8 Router A 10.20.0.0/16 Router B 10.20.30.0/24 Router C 0.0.0.0/0 Router D Um pacote destinado ao endereço 10.20.30.50 chega ao roteador. Por qual próximo salto o roteador deverá encaminhar o pacote?","options":{"A":"Router A","B":"Router B","C":"Router C","D":"Router D"}},{"n":25,"q":"Um switch Ethernet recebe um frame cujo endereço MAC de destino está presente em sua tabela MAC. O que o switch normalmente fará?","options":{"A":"Encaminhar o frame para a porta associada ao MAC de destino.","B":"Encaminhar o frame para o roteador padrão.","C":"Alterar o endereço IP de destino.","D":"Enviar o frame para todas as portas."}},{"n":26,"q":"Um administrador precisa separar logicamente os computadores do Financeiro e do RH, mesmo que ambos estejam conectados aos mesmos switches físicos. Qual recurso do switch deve ser utilizado?","options":{"A":"NAT","B":"VLAN","C":"DHCP","D":"PAT"}},{"n":27,"q":"Um switch recebe um frame Ethernet cujo MAC de destino não está presente em sua tabela MAC. O frame chegou pela porta 10. Qual comportamento é esperado em condições normais?","options":{"A":"O switch descarta imediatamente o frame porque não conhece o destino.","B":"O switch encaminha o frame somente pela porta 10.","C":"O switch realiza flooding do frame pelas portas pertencentes à mesma VLAN, exceto pela porta de entrada.","D":"O switch encaminha o frame para o gateway padrão para que o roteador descubra o destino."}},{"n":28,"q":"Uma organização deseja impedir que computadores da rede interna acessem determinados endereços IP externos e permitir apenas conexões previamente autorizadas. Qual dispositivo é projetado principalmente para aplicar esse tipo de controle?","options":{"A":"Switch","B":"Firewall","C":"Access Point","D":"NAS"}},{"n":29,"q":"Um administrador configura uma regra no firewall: Permitir TCP da rede 192.168.10.0/24 para 10.10.10.50, porta 443. Um computador 192.168.10.25 tenta acessar 10.10.10.50 usando HTTPS. Qual será o comportamento esperado, considerando que não existe nenhuma regra posterior bloqueando essa comunicação?","options":{"A":"O firewall permitirá a comunicação TCP para a porta 443.","B":"O firewall bloqueará porque HTTPS utiliza UDP.","C":"O firewall permitirá somente tráfego ICMP.","D":"O firewall encaminhará o tráfego para o DNS antes de permitir a conexão."}},{"n":30,"q":"Um firewall possui as seguintes regras, avaliadas de cima para baixo: Ordem Origem Destino Serviço Ação 1 192.168.10.0/24 Qualquer HTTPS DENY Ordem Origem Destino Serviço Ação 2 192.168.10.50 172.16.10.20 HTTPS ALLOW 3 Qualquer Qualquer Qualquer ALLOW Um administrador tenta acessar https://172.16.10.20 a partir do computador 192.168.10.50. O que acontecerá?","options":{"A":"A conexão será permitida pela regra 2, porque ela é mais específica.","B":"A conexão será permitida pela regra 3, pois ela permite qualquer tráfego.","C":"A conexão será bloqueada pela regra 1.","D":"O firewall escolherá automaticamente a regra mais específica."}},{"n":31,"q":"Uma empresa instala um IDS (Intrusion Detection System) para identificar atividades suspeitas na rede. Qual é a principal função de um IDS?","options":{"A":"Bloquear automaticamente todo tráfego suspeito.","B":"Detectar atividades potencialmente maliciosas e gerar alertas.","C":"Distribuir tráfego entre vários servidores.","D":"Traduzir endereços IP privados em públicos."}},{"n":32,"q":"Um administrador percebe que um servidor está recebendo várias tentativas de conexão que correspondem a um padrão conhecido de ataque. O IDS identifica o comportamento e registra o evento, mas o tráfego continua chegando ao servidor. Qual característica do IDS explica esse comportamento?","options":{"A":"O IDS é projetado principalmente para detectar e alertar, não necessariamente para bloquear o tráfego.","B":"O IDS só consegue analisar tráfego UDP.","C":"O IDS sempre funciona como gateway padrão da rede.","D":"O IDS substitui o firewall na filtragem de tráfego."}},{"n":33,"q":"Uma organização possui um IDS conectado a uma porta SPAN/mirror de um switch. O IDS recebe uma cópia do tráfego que passa por determinadas interfaces. Um atacante envia um pacote malicioso para um servidor. O IDS identifica o padrão de ataque e gera um alerta, mas o pacote continua chegando ao servidor. Qual afirmação explica CORRETAMENTE esse cenário?","options":{"A":"O IDS está funcionando incorretamente porque todo IDS deve bloquear ataques automaticamente.","B":"O IDS está atuando de forma passiva, analisando uma cópia do tráfego, enquanto o bloqueio exigiria uma capacidade de prevenção, como a de um IPS.","C":"O IDS deveria alterar o endereço MAC do atacante antes de enviar o alerta.","D":"O IDS precisa atuar na Camada 3 obrigatoriamente para conseguir detectar ataques."}},{"n":34,"q":"Uma empresa deseja detectar tráfego malicioso e bloquear automaticamente uma tentativa de ataque antes que ela alcance o servidor. Qual dispositivo atende diretamente a esse requisito?","options":{"A":"IDS","B":"IPS","C":"Proxy","D":"Switch"}},{"n":35,"q":"Um IPS está configurado inline entre os usuários e os servidores. Um atacante tenta explorar uma vulnerabilidade conhecida enviando uma requisição maliciosa. O IPS identifica o padrão do ataque. Qual é a ação mais característica que ele pode executar?","options":{"A":"Apenas registrar o evento e permitir a requisição.","B":"Bloquear ou descartar o tráfego malicioso.","C":"Alterar o endereço IP do servidor.","D":"Criar automaticamente uma nova VLAN para o atacante."}},{"n":36,"q":"Uma organização utiliza um IPS para proteção contra ataques. Após uma atualização das assinaturas, o IPS começa a bloquear uma aplicação legítima sempre que determinados padrões de dados aparecem nas requisições. O administrador confirma que as requisições são legítimas. Qual problema está ocorrendo?","options":{"A":"False positive","B":"False negative","C":"MAC flooding","D":"Split tunneling"}},{"n":37,"q":"Uma empresa possui três servidores web que hospedam o mesmo sistema. O administrador deseja distribuir as requisições dos usuários entre os três servidores para evitar que apenas um deles fique sobrecarregado. Qual dispositivo atende diretamente a essa necessidade?","options":{"A":"Firewall","B":"Load Balancer","C":"Switch","D":"IDS"}},{"n":38,"q":"Uma aplicação possui quatro servidores web. Um deles apresenta uma falha e deixa de responder às requisições. O balanceador de carga detecta que o servidor está indisponível e deixa de encaminhar novas requisições para ele, direcionando-as aos servidores saudáveis. Qual recurso está sendo utilizado?","options":{"A":"NAT","B":"Health check","C":"VLAN tagging","D":"Port mirroring"}},{"n":39,"q":"Uma aplicação utiliza um Load Balancer na frente de cinco servidores web. O administrador deseja que as requisições sejam distribuídas considerando a quantidade de conexões atualmente ativas em cada servidor. Qual algoritmo de balanceamento é mais adequado?","options":{"A":"Round Robin","B":"Least Connections","C":"Static NAT","D":"First Come, First Served"}},{"n":40,"q":"Uma empresa deseja que os computadores dos funcionários acessem a Internet através de um servidor intermediário, permitindo controlar e registrar os sites acessados. Qual dispositivo/serviço atende diretamente a essa necessidade?","options":{"A":"Proxy","B":"Switch","C":"Router","D":"NAS"}},{"n":41,"q":"Uma empresa utiliza um proxy HTTP. Um funcionário solicita várias vezes o mesmo conteúdo web, e o proxy possui uma cópia armazenada em seu cache. Qual benefício pode ocorrer nesse cenário?","options":{"A":"O proxy elimina a necessidade de DNS em toda a rede.","B":"O proxy pode entregar o conteúdo armazenado localmente, reduzindo o tráfego externo e o tempo de resposta.","C":"O proxy transforma automaticamente IPv4 em IPv6.","D":"O proxy substitui o switch da rede local."}},{"n":42,"q":"Uma organização deseja implementar um mecanismo que fique entre os usuários internos e os servidores externos. O mecanismo deve ocultar os endereços dos clientes, aplicar políticas de acesso e registrar as requisições realizadas pelos usuários. Qual solução é mais adequada?","options":{"A":"Reverse proxy","B":"Forward proxy","C":"Load balancer","D":"IDS passivo"}},{"n":43,"q":"Uma empresa precisa disponibilizar uma área centralizada para que os funcionários armazenem e compartilhem arquivos, como documentos, planilhas e PDFs, através da rede. Qual solução é mais adequada?","options":{"A":"NAS","B":"Router","C":"Firewall","D":"IPS"}},{"n":44,"q":"Uma organização deseja disponibilizar um servidor de arquivos centralizado para usuários Windows. Os usuários precisam acessar pastas compartilhadas, com permissões definidas para diferentes departamentos. Qual característica do NAS atende diretamente a essa necessidade?","options":{"A":"Fornecimento de armazenamento em nível de bloco por Fibre Channel.","B":"Fornecimento de armazenamento em nível de arquivo através de protocolos como SMB.","C":"Roteamento de pacotes entre diferentes redes IP.","D":"Distribuição de conexões entre servidores web."}},{"n":45,"q":"Uma empresa possui um NAS utilizado por vários departamentos. O administrador deseja garantir que os usuários do Financeiro não consigam acessar os compartilhamentos destinados ao RH, mesmo que ambos estejam armazenados no mesmo equipamento. Qual recurso é mais diretamente relacionado a esse requisito?","options":{"A":"ACL/permissões de acesso aos arquivos e compartilhamentos","B":"NAT","C":"Spanning Tree Protocol (STP)","D":"Round Robin"}},{"n":46,"q":"Uma empresa precisa fornecer aos servidores acesso a um sistema de armazenamento centralizado de alto desempenho, utilizando armazenamento em nível de bloco. Qual tecnologia é mais adequada?","options":{"A":"NAS","B":"SAN","C":"Proxy","D":"Load Balancer"}},{"n":47,"q":"Um ambiente de virtualização possui dezenas de servidores que precisam acessar um armazenamento compartilhado de alto desempenho. O administrador está avaliando Fibre Channel (FC) e iSCSI. Qual afirmação está correta?","options":{"A":"Fibre Channel utiliza exclusivamente SMB para acessar arquivos.","B":"iSCSI permite transportar comandos SCSI através de uma rede IP.","C":"SAN funciona exclusivamente com Fibre Channel.","D":"iSCSI é utilizado apenas para compartilhamento de arquivos."}},{"n":48,"q":"Uma empresa possui um cluster de virtualização com vários hosts. Todos os hosts precisam acessar os mesmos volumes de armazenamento, mas o administrador deseja manter o tráfego de armazenamento separado do tráfego comum da rede corporativa. Qual solução atende melhor a esse cenário?","options":{"A":"NAS utilizando apenas SMB na mesma VLAN dos usuários","B":"SAN com uma rede/fabric dedicada para armazenamento","C":"Proxy reverso para os servidores de virtualização","D":"Load Balancer distribuindo as conexões entre os discos"}},{"n":49,"q":"Uma empresa deseja fornecer acesso Wi-Fi aos funcionários. Os computadores e celulares precisam se conectar à rede sem utilizar cabos Ethernet. Qual dispositivo é responsável por fornecer conectividade Wi-Fi aos clientes?","options":{"A":"Router","B":"Access Point (AP)","C":"NAS","D":"Firewall"}},{"n":50,"q":"Uma organização possui 50 Access Points espalhados por um prédio. O administrador deseja centralizar a configuração, o gerenciamento e o monitoramento desses APs, em vez de configurar cada equipamento individualmente. Qual solução é mais adequada?","options":{"A":"WLC (Wireless LAN Controller)","B":"NAS","C":"Proxy","D":"IDS"}},{"n":51,"q":"Uma empresa possui vários Access Points distribuídos por seus andares. Um funcionário inicia uma chamada VoIP enquanto se desloca pelo prédio. Durante o deslocamento, o dispositivo muda de um AP para outro sem perder significativamente a conectividade. Qual conceito está diretamente relacionado a esse comportamento?","options":{"A":"Roaming","B":"NAT","C":"Port Forwarding","D":"VLAN Trunking"}},{"n":52,"q":"Uma empresa deseja substituir um appliance físico de firewall por uma solução que possa ser executada como software sobre uma infraestrutura virtualizada. Qual conceito de nuvem está relacionado a essa abordagem?","options":{"A":"VPC","B":"NFV","C":"SaaS","D":"CDN"}},{"n":53,"q":"Uma organização utiliza uma infraestrutura de nuvem e deseja implementar um firewall sem adquirir um appliance físico dedicado. O firewall será executado como uma máquina virtual sobre servidores de virtualização. Qual é a principal característica que permite classificar essa solução como NFV?","options":{"A":"O firewall utiliza obrigatoriamente uma VPC pública.","B":"A função de rede foi implementada como software sobre infraestrutura virtualizada.","C":"O firewall precisa utilizar exclusivamente IPv6.","D":"O firewall é fornecido necessariamente como SaaS."}},{"n":54,"q":"Uma empresa possui uma infraestrutura de rede tradicional composta por appliances físicos de firewall, roteadores e balanceadores de carga. A equipe de TI deseja reduzir a dependência de hardware dedicado e permitir que essas funções sejam instanciadas, dimensionadas e migradas utilizando uma infraestrutura virtualizada. Qual alternativa descreve melhor os benefícios esperados com NFV?","options":{"A":"As funções de rede passam a depender exclusivamente de equipamentos físicos mais especializados.","B":"As funções de rede podem ser implementadas como software, permitindo maior flexibilidade, automação e utilização de recursos virtualizados.","C":"Todos os serviços de rede passam obrigatoriamente a utilizar SaaS.","D":"NFV elimina a necessidade de endereçamento IP e roteamento."}},{"n":55,"q":"Uma empresa utiliza serviços de computação em nuvem e deseja criar uma rede virtual isolada, onde poderá configurar sub-redes, rotas, gateways e regras de segurança para seus recursos. Qual conceito atende diretamente a essa necessidade?","options":{"A":"VPC","B":"SaaS","C":"NFV","D":"CDN"}},{"n":56,"q":"Uma organização cria uma VPC com duas sub-redes: • Subnet A: servidores web, com acesso controlado à Internet. • Subnet B: banco de dados, sem acesso direto à Internet. Qual é uma das principais vantagens de utilizar sub-redes dentro da VPC nesse cenário?","options":{"A":"Permitir segmentação lógica dos recursos e aplicação de diferentes políticas de roteamento e segurança.","B":"Eliminar completamente a necessidade de endereços IP.","C":"Transformar automaticamente todos os servidores em SaaS.","D":"Permitir que qualquer recurso da VPC tenha acesso irrestrito à Internet."}},{"n":57,"q":"Uma empresa hospeda uma aplicação em uma VPC. Os servidores de aplicação precisam acessar recursos internos de outra rede corporativa localizada no data center da empresa. A organização deseja estabelecer conectividade privada entre os dois ambientes, mantendo o isolamento lógico da VPC. Qual solução é mais adequada?","options":{"A":"Criar uma segunda conta SaaS para os servidores.","B":"Utilizar um mecanismo de conectividade entre a VPC e a rede corporativa, como uma VPN site-to-site ou conexão dedicada, juntamente com as rotas apropriadas.","C":"Instalar um Access Point dentro da VPC.","D":"Utilizar exclusivamente DNS público para conectar as duas redes."}},{"n":58,"q":"Uma empresa possui máquinas virtuais em uma VPC e deseja controlar quais conexões de rede podem entrar e sair dessas máquinas, utilizando regras baseadas em IP, porta e protocolo. Qual recurso é mais adequado?","options":{"A":"NSG (Network Security Group)","B":"VPC","C":"SaaS","D":"Load Balancer"}},{"n":59,"q":"Uma empresa possui um servidor web em uma VPC. O servidor deve aceitar conexões HTTPS da Internet, mas não deve aceitar conexões SSH (TCP/22) provenientes da Internet. Qual configuração de NSG atende melhor ao requisito?","options":{"A":"Permitir TCP/443 e bloquear TCP/22 para o tráfego de entrada.","B":"Permitir TCP/22 e bloquear TCP/443 para o tráfego de entrada.","C":"Permitir todo o tráfego de entrada e bloquear somente UDP.","D":"Bloquear todo o tráfego de saída do servidor."}},{"n":60,"q":"Uma aplicação em nuvem possui três servidores: • Web: 10.0.1.10 • App: 10.0.2.10 • Banco: 10.0.3.10 O requisito de segurança é: 1. A Internet pode acessar o Web somente pela porta TCP/443. 2. O Web pode acessar o App pela porta TCP/8080. 3. O App pode acessar o Banco pela porta TCP/3306. 4. O Banco não deve aceitar conexões diretamente da Internet. Qual abordagem representa melhor o uso de NSGs?","options":{"A":"Permitir TCP/443, TCP/8080 e TCP/3306 de qualquer origem para todos os servidores.","B":"Aplicar regras específicas por recurso/sub-rede, restringindo origem, destino e porta conforme o fluxo permitido.","C":"Colocar todos os servidores na mesma sub-rede e permitir todo o tráfego interno.","D":"Bloquear todo o tráfego da VPC e permitir somente DNS."}},{"n":61,"q":"Uma empresa possui recursos hospedados em uma VPC e precisa fornecer um ponto de comunicação entre a rede virtual da nuvem e redes externas. Qual componente pode desempenhar essa função?","options":{"A":"Cloud Gateway","B":"NAS","C":"Switch de acesso","D":"IDS"}},{"n":62,"q":"Uma empresa possui servidores em uma VPC e precisa permitir que esses servidores acessem a Internet. A equipe configura uma sub-rede privada e utiliza um gateway apropriado para fornecer conectividade de saída sem necessariamente expor diretamente os servidores à Internet. Qual conceito está mais relacionado a essa função?","options":{"A":"Cloud gateway","B":"VLAN","C":"Load Balancer","D":"NAS"}},{"n":63,"q":"Uma empresa possui uma VPC na nuvem com a rede 10.10.0.0/16 e um data center on-premises com a rede 192.168.0.0/16. Os servidores da VPC precisam acessar sistemas internos do data center utilizando endereços privados. A equipe estabelece uma VPN site-to-site entre os ambientes. Além da VPN, o que é essencial para que o tráfego entre as redes funcione corretamente?","options":{"A":"Configurar rotas apropriadas apontando o tráfego destinado à rede remota para o gateway/conexão correspondente.","B":"Criar um novo SSID para a rede on-premises.","C":"Instalar um proxy HTTP em todos os servidores.","D":"Alterar todos os endereços privados para endereços públicos."}},{"n":64,"q":"Uma empresa decide hospedar seus servidores e aplicações utilizando recursos de um provedor de nuvem que atende diversos clientes, compartilhando a infraestrutura física subjacente. Qual modelo de implantação está sendo utilizado?","options":{"A":"Nuvem privada","B":"Nuvem híbrida","C":"Nuvem pública","D":"Nuvem comunitária"}},{"n":65,"q":"Uma startup precisa lançar rapidamente uma aplicação e não quer comprar servidores físicos, montar um data center ou manter toda a infraestrutura de hardware. Ela decide contratar recursos computacionais de um provedor de nuvem pública conforme sua necessidade. Qual é uma das principais vantagens desse modelo?","options":{"A":"A empresa precisa comprar todo o hardware antes de utilizar o serviço.","B":"A empresa pode obter recursos sob demanda e aumentar ou reduzir sua utilização conforme a necessidade.","C":"Todos os recursos físicos ficam exclusivamente dedicados à empresa.","D":"A empresa deixa de ter qualquer responsabilidade sobre segurança."}},{"n":66,"q":"Uma empresa possui uma aplicação crítica que precisa de grande capacidade durante períodos específicos do ano. Em vez de manter servidores físicos dimensionados para o pico durante todo o ano, a empresa utiliza uma nuvem pública e aumenta os recursos durante os períodos de maior demanda, reduzindo-os posteriormente. Qual característica da nuvem pública está sendo explorada principalmente?","options":{"A":"Elasticidade","B":"Isolamento físico exclusivo","C":"Virtualização de funções de rede (NFV)","D":"Armazenamento em bloco SAN"}},{"n":67,"q":"Uma empresa decide construir uma infraestrutura de nuvem exclusiva para seu próprio uso, utilizando servidores localizados em seu Data Center. Nenhuma outra organização utiliza diretamente esses recursos. Qual modelo de implantação está sendo utilizado?","options":{"A":"Nuvem pública (Public Cloud)","B":"Nuvem privada (Private Cloud)","C":"Nuvem híbrida (Hybrid Cloud)","D":"SaaS"}},{"n":68,"q":"Um hospital deseja utilizar características de computação em nuvem, como virtualização, provisionamento sob demanda e automação, mas possui requisitos rigorosos de controle sobre seus dados. Para isso, mantém uma infraestrutura de nuvem dedicada dentro de seu próprio Data Center. Qual é a principal característica que diferencia essa solução de uma nuvem pública?","options":{"A":"A nuvem privada obrigatoriamente utiliza servidores físicos, sem virtualização.","B":"A nuvem privada é dedicada a uma única organização, proporcionando maior controle sobre infraestrutura e políticas.","C":"A nuvem privada não permite provisionamento automático de recursos.","D":"A nuvem privada necessariamente utiliza serviços SaaS."}},{"n":69,"q":"Uma organização possui uma Private Cloud em seu próprio Data Center. Ela utiliza virtualização para criar máquinas virtuais sob demanda e possui um portal de autosserviço para que os administradores possam aumentar ou reduzir recursos conforme a necessidade. Durante uma auditoria, um profissional afirma: \"Isso não pode ser considerado uma nuvem privada, porque recursos de nuvem precisam obrigatoriamente estar hospedados por um provedor de nuvem pública.\" Qual alternativa está correta?","options":{"A":"O profissional está correto, pois somente AWS, Azure e outros provedores públicos podem oferecer computação em nuvem.","B":"O profissional está correto, pois uma nuvem privada não pode utilizar virtualização.","C":"O profissional está incorreto, pois uma nuvem privada pode ser implementada pela própria organização e utilizar virtualização, automação e provisionamento sob demanda.","D":"O profissional está incorreto apenas se a organização também utilizar SaaS."}},{"n":70,"q":"Uma empresa mantém seus sistemas críticos em uma Private Cloud, mas utiliza recursos de uma Public Cloud para hospedar aplicações que precisam de maior capacidade durante períodos de alta demanda. Qual modelo de implantação está sendo utilizado?","options":{"A":"Nuvem pública (Public Cloud)","B":"Nuvem privada (Private Cloud)","C":"Nuvem híbrida (Hybrid Cloud)","D":"SaaS"}},{"n":71,"q":"Uma empresa possui um banco de dados com informações sensíveis hospedado em sua Private Cloud. Porém, mantém seu sistema web na Public Cloud. Os dois ambientes estão conectados por uma VPN e trocam informações entre si. Qual característica melhor descreve esse cenário?","options":{"A":"É uma Public Cloud, pois parte da infraestrutura está em um provedor externo.","B":"É uma Private Cloud, pois os dados sensíveis estão em infraestrutura dedicada.","C":"É uma Hybrid Cloud, pois ambientes privados e públicos estão integrados.","D":"É SaaS, pois a aplicação web está hospedada na nuvem."}},{"n":72,"q":"Um hospital mantém seus sistemas clínicos e dados sensíveis em uma Private Cloud. Durante períodos de grande demanda, como campanhas de vacinação, o hospital utiliza servidores adicionais em uma Public Cloud para executar componentes temporários da aplicação. A infraestrutura privada e a pública estão conectadas por uma VPN, e os recursos da Public Cloud são utilizados somente quando necessário. Qual é a principal vantagem do modelo utilizado nesse cenário?","options":{"A":"Eliminar completamente a necessidade de infraestrutura privada.","B":"Permitir que todos os dados sensíveis sejam obrigatoriamente armazenados na Public Cloud.","C":"Combinar o controle da infraestrutura privada com a elasticidade e capacidade adicional da Public Cloud.","D":"Garantir que os recursos da Public Cloud sejam dedicados exclusivamente ao hospital."}},{"n":73,"q":"Uma empresa utiliza um sistema de e-mail corporativo diretamente pelo navegador. A organização não precisa instalar o software nos computadores nem administrar os servidores que executam o sistema. Qual modelo de serviço de nuvem está sendo utilizado?","options":{"A":"IaaS","B":"PaaS","C":"SaaS","D":"NFV"}},{"n":74,"q":"Uma organização contrata um sistema de gestão empresarial em nuvem. Os usuários acessam a aplicação pelo navegador. O provedor é responsável pelos servidores, sistema operacional, banco de dados, atualizações e manutenção da aplicação. Qual modelo de serviço está sendo utilizado?","options":{"A":"IaaS, porque existem máquinas virtuais envolvidas.","B":"PaaS, porque a aplicação utiliza recursos computacionais.","C":"SaaS, porque o cliente utiliza uma aplicação pronta e o provedor administra a infraestrutura e o software.","D":"Private Cloud, porque a aplicação pertence à organização."}},{"n":75,"q":"Uma empresa precisa disponibilizar um sistema de gestão para 500 funcionários. Ela compara três alternativas: • Solução A: recebe máquinas virtuais e é responsável pelo sistema operacional e pelas aplicações. • Solução B: recebe um ambiente de desenvolvimento para criar e publicar suas próprias aplicações. • Solução C: recebe uma aplicação empresarial pronta, acessada pela Internet, enquanto o provedor administra a infraestrutura, o sistema operacional, a aplicação e suas atualizações. Qual alternativa representa SaaS?","options":{"A":"Somente a solução A.","B":"Somente a solução B.","C":"Somente a solução C.","D":"As soluções B e C."}},{"n":76,"q":"Uma empresa deseja contratar recursos de computação em nuvem e recebe máquinas virtuais, armazenamento e recursos de rede. A empresa será responsável por instalar e administrar o sistema operacional e suas aplicações. Qual modelo de serviço está sendo utilizado?","options":{"A":"SaaS","B":"PaaS","C":"IaaS","D":"NFV"}},{"n":77,"q":"Uma empresa migrou um servidor físico para uma máquina virtual em um provedor de nuvem. O provedor administra o hardware físico, hypervisor e Data Center, enquanto a empresa administra o sistema operacional, aplicações e dados da máquina virtual. Qual modelo de serviço melhor representa esse cenário?","options":{"A":"SaaS","B":"PaaS","C":"IaaS","D":"Hybrid Cloud"}},{"n":78,"q":"Uma empresa está avaliando três opções de serviços em nuvem: • Opção A: recebe uma aplicação pronta. O provedor administra a aplicação, sistema operacional, infraestrutura e atualizações. • Opção B: recebe uma plataforma gerenciada para desenvolver e publicar suas próprias aplicações, sem administrar diretamente o sistema operacional. • Opção C: recebe máquinas virtuais, redes e armazenamento. A empresa instala o sistema operacional, configura suas aplicações e administra os dados. Qual alternativa identifica corretamente os modelos?","options":{"A":"A = IaaS, B = SaaS, C = PaaS","B":"A = SaaS, B = PaaS, C = IaaS","C":"A = PaaS, B = IaaS, C = SaaS","D":"A = SaaS, B = IaaS, C = PaaS"}},{"n":79,"q":"Uma equipe de desenvolvedores precisa criar e publicar uma aplicação. O provedor de nuvem fornece o ambiente de desenvolvimento, runtime, banco de dados e ferramentas necessárias, sem que os desenvolvedores precisem administrar os servidores físicos ou o sistema operacional. Qual modelo de serviço está sendo utilizado?","options":{"A":"SaaS","B":"IaaS","C":"PaaS","D":"NFV"}},{"n":80,"q":"Uma empresa deseja desenvolver uma aplicação web, mas não quer se preocupar com a instalação e manutenção do sistema operacional, servidores, runtime e infraestrutura. Os desenvolvedores querem apenas escrever o código, configurar a aplicação e publicá-la. Qual modelo de serviço atende melhor essa necessidade?","options":{"A":"IaaS","B":"PaaS","C":"SaaS","D":"Private Cloud"}},{"n":81,"q":"Uma organização está comparando três modelos de nuvem para uma nova aplicação: • Modelo A: fornece máquinas virtuais, armazenamento e redes. A equipe precisa instalar e administrar o sistema operacional. • Modelo B: fornece uma plataforma gerenciada para desenvolvimento e execução da aplicação. A equipe administra principalmente o código e os dados. • Modelo C: fornece uma aplicação pronta que os usuários simplesmente acessam pela Internet. Qual alternativa apresenta corretamente os modelos?","options":{"A":"A = SaaS, B = IaaS, C = PaaS","B":"A = IaaS, B = PaaS, C = SaaS","C":"A = PaaS, B = SaaS, C = IaaS","D":"A = IaaS, B = SaaS, C = PaaS"}},{"n":82,"q":"Um administrador precisa transferir arquivos entre um computador cliente e um servidor utilizando o protocolo FTP. Qual é a porta TCP padrão utilizada pelo FTP para a conexão de controle?","options":{"A":"TCP 20","B":"TCP 21","C":"TCP 22","D":"TCP 23"}},{"n":83,"q":"Um administrador configura uma conexão FTP no modo ativo (Active FTP). O cliente consegue estabelecer a conexão de controle com o servidor, mas precisa também transferir os arquivos. Qual combinação de portas está associada ao FTP ativo tradicional?","options":{"A":"TCP 20 para controle e TCP 21 para dados.","B":"TCP 21 para controle e TCP 20 para dados.","C":"TCP 22 para controle e TCP 20 para dados.","D":"TCP 21 para controle e TCP 22 para dados."}},{"n":84,"q":"Um firewall permite a conexão TCP/21 entre um cliente e um servidor FTP. O usuário consegue autenticar-se e executar comandos, como listar diretórios, mas o download dos arquivos falha. O servidor está configurado para utilizar FTP passivo (Passive FTP). Qual é a explicação mais provável?","options":{"A":"A porta TCP 21 deve ser bloqueada, pois ela é utilizada somente para autenticação.","B":"O FTP passivo utiliza TCP 22 para transferência dos arquivos.","C":"É necessário permitir também as portas de dados configuradas para o modo passivo no servidor FTP.","D":"O FTP passivo utiliza obrigatoriamente TCP 20 para transferência dos arquivos."}},{"n":85,"q":"Um administrador precisa transferir arquivos entre um computador e um servidor de forma segura e criptografada. Ele decide utilizar SFTP. Qual é a porta TCP padrão utilizada pelo SFTP?","options":{"A":"TCP 20","B":"TCP 21","C":"TCP 22","D":"TCP 23"}},{"n":86,"q":"Um administrador precisa substituir um serviço FTP tradicional porque os arquivos transferidos contêm informações confidenciais. Ele deseja utilizar um protocolo que forneça criptografia, autenticação e transferência de arquivos, utilizando a infraestrutura do SSH. Qual protocolo deve ser utilizado?","options":{"A":"FTP","B":"TFTP","C":"SFTP","D":"Telnet"}},{"n":87,"q":"Um firewall foi configurado permitindo apenas TCP/21 para um servidor que anteriormente utilizava FTP. Após a migração para SFTP, os usuários não conseguem mais estabelecer conexão. O administrador verifica que o servidor SFTP está funcionando corretamente. Qual alteração deve ser feita no firewall?","options":{"A":"Manter TCP/21, pois SFTP é apenas uma versão criptografada do FTP.","B":"Permitir TCP/20, pois essa é a porta utilizada pelo canal de dados do SFTP.","C":"Permitir TCP/22, pois o SFTP utiliza o protocolo SSH para estabelecer a comunicação.","D":"Permitir TCP/23, pois o SFTP utiliza Telnet para autenticação."}},{"n":88,"q":"Um administrador de redes precisa acessar remotamente um servidor Linux de forma segura e criptografada. Qual protocolo deve ser utilizado?","options":{"A":"Telnet","B":"FTP","C":"SSH","D":"HTTP"}},{"n":89,"q":"Um administrador precisa acessar remotamente um servidor Linux. Ele deseja executar comandos no servidor e garantir que as credenciais e os dados transmitidos estejam protegidos contra interceptação. Qual alternativa apresenta corretamente o protocolo e sua porta padrão?","options":{"A":"Telnet — TCP 23","B":"SSH — TCP 22","C":"FTP — TCP 21","D":"HTTPS — TCP 443"}},{"n":90,"q":"Um administrador tenta acessar um switch remotamente usando SSH, mas a conexão não é estabelecida. Após verificar o firewall, ele confirma que TCP/22 está permitido. O serviço SSH está ativo no switch. Durante a investigação, ele descobre que o dispositivo está configurado para aceitar conexões SSH somente a partir da rede 192.168.10.0/24, enquanto o computador do administrador está na rede 192.168.20.0/24. Qual é a causa mais provável do problema?","options":{"A":"A porta TCP/22 está incorreta para SSH.","B":"SSH só funciona em servidores Linux.","C":"O acesso está sendo bloqueado pela restrição de origem configurada para o serviço SSH.","D":"SSH utiliza UDP/22, portanto o TCP/22 liberado no firewall não tem efeito."}},{"n":91,"q":"Um administrador precisa identificar o protocolo utilizado para acesso remoto a um equipamento de rede através de uma sessão de terminal sem criptografia. Qual protocolo utiliza normalmente a porta TCP 23?","options":{"A":"SSH","B":"Telnet","C":"FTP","D":"RDP"}},{"n":92,"q":"Um administrador está configurando o acesso remoto a um switch. Ele possui duas opções: • Opção A: Telnet — TCP 23 • Opção B: SSH — TCP 22 O administrador precisa escolher a opção mais segura para administrar o equipamento. Qual alternativa está correta?","options":{"A":"Telnet, porque utiliza TCP e, portanto, já fornece criptografia.","B":"Telnet, porque a porta 23 é mais segura que a 22.","C":"SSH, porque fornece comunicação criptografada, enquanto Telnet não fornece criptografia nativa.","D":"Ambos são igualmente seguros, pois a diferença está apenas na porta utilizada."}},{"n":94,"q":"Um administrador utiliza Telnet para acessar um equipamento de rede. Durante uma análise de segurança, ele executa uma captura de pacotes e consegue visualizar claramente o usuário e a senha utilizados na sessão. Qual característica do Telnet explica esse comportamento?","options":{"A":"O Telnet utiliza criptografia fraca baseada em DES.","B":"O Telnet utiliza criptografia somente para as credenciais, mas não para os comandos.","C":"O Telnet transmite a comunicação em texto claro (plaintext), sem criptografia nativa.","D":"O Telnet utiliza a mesma criptografia do SSH, mas permite que o administrador a desative."}},{"n":95,"q":"Um servidor de e-mail precisa enviar uma mensagem para outro servidor de e-mail utilizando SMTP. Qual é a porta TCP tradicionalmente associada ao SMTP para transferência de mensagens entre servidores?","options":{"A":"TCP 21","B":"TCP 25","C":"TCP 53","D":"TCP 110"}},{"n":96,"q":"Uma empresa deseja configurar seus clientes de e-mail para enviar mensagens ao servidor SMTP. O administrador quer utilizar uma porta destinada à submissão de mensagens por usuários autenticados, em vez da porta tradicional utilizada para comunicação entre servidores. Qual porta é normalmente utilizada para essa finalidade?","options":{"A":"TCP 25","B":"TCP 53","C":"TCP 587","D":"TCP 3389"}},{"n":97,"q":"Um usuário configura seu cliente de e-mail para enviar mensagens utilizando SMTP na porta TCP 25. A conexão com o servidor funciona, mas o servidor rejeita o envio porque a política exige autenticação de usuários e submissão de mensagens pela porta apropriada. Qual alteração é mais adequada?","options":{"A":"Alterar para TCP 53, pois SMTP depende do DNS.","B":"Alterar para TCP 587 e configurar autenticação SMTP.","C":"Alterar para TCP 110, pois essa porta é utilizada para envio de e-mails.","D":"Alterar para TCP 443, pois SMTP utiliza HTTPS para criptografia."}},{"n":98,"q":"Um usuário digita www.exemplo.com no navegador. Antes de estabelecer a conexão com o servidor web, o computador precisa descobrir qual endereço IP está associado ao nome do domínio. Qual protocolo é responsável por realizar essa resolução de nomes?","options":{"A":"DHCP","B":"DNS","C":"HTTP","D":"SMTP"}},{"n":99,"q":"Um computador consegue acessar um servidor utilizando diretamente seu endereço IP, mas apresenta erro quando o usuário tenta acessá-lo pelo nome servidor.comptia.local. O administrador verifica que a conectividade IP está funcionando normalmente. Qual serviço deve ser investigado primeiro?","options":{"A":"DNS","B":"DHCP","C":"SMTP","D":"SNMP"}},{"n":100,"q":"Um cliente DNS realiza uma consulta para resolver o endereço IP de www.exemplo.com. Normalmente, a consulta DNS utiliza UDP/53, mas em determinadas situações o cliente precisa utilizar TCP/53. Qual situação pode justificar o uso de TCP para DNS?","options":{"A":"Toda consulta DNS obrigatoriamente utiliza TCP.","B":"O cliente precisa acessar um site HTTPS.","C":"Uma transferência de zona DNS (zone transfer) está sendo realizada.","D":"O servidor DNS precisa obter um endereço IP via DHCP."}},{"n":101,"q":"Um computador é conectado à rede e precisa receber automaticamente um endereço IP, máscara de sub-rede, gateway padrão e servidor DNS. Qual protocolo é responsável por fornecer essas configurações automaticamente?","options":{"A":"DNS","B":"DHCP","C":"HTTP","D":"SNMP"}},{"n":102,"q":"Um computador é conectado a uma rede configurada para utilizar DHCP. O cliente ainda não possui um endereço IP válido e precisa localizar um servidor DHCP para solicitar uma configuração. Qual combinação de portas é utilizada pelo DHCP?","options":{"A":"TCP 67 no cliente e TCP 68 no servidor","B":"UDP 67 no servidor e UDP 68 no cliente","C":"UDP 53 no servidor e UDP 54 no cliente","D":"TCP 20 no servidor e TCP 21 no cliente"}},{"n":103,"q":"Um computador Windows é conectado à rede, mas não consegue obter uma configuração válida de um servidor DHCP. Após o processo de tentativa automática, ele recebe o endereço: 169.254.35.80/16 O usuário não consegue acessar outros dispositivos de diferentes redes. Qual é a explicação mais provável?","options":{"A":"O DNS atribuiu automaticamente o endereço 169.254.35.80 ao computador.","B":"O computador recebeu um endereço APIPA porque não conseguiu obter uma configuração válida via DHCP.","C":"O computador recebeu um endereço público temporário fornecido pelo roteador.","D":"O servidor DHCP utilizou 169.254.0.0/16 como sua faixa padrão de endereços públicos."}},{"n":104,"q":"Um usuário acessa um site utilizando o protocolo HTTP sem criptografia. Qual é a porta TCP padrão utilizada pelo HTTP?","options":{"A":"TCP 21","B":"TCP 53","C":"TCP 80","D":"TCP 443"}},{"n":105,"q":"Um navegador estabelece uma conexão com um servidor web utilizando HTTP/1.1. O navegador envia uma solicitação para obter uma página e o servidor retorna o conteúdo solicitado. Qual componente do HTTP indica ao servidor qual recurso o cliente deseja acessar, como /index.html?","options":{"A":"Método HTTP e URI/URL do recurso solicitado","B":"Endereço MAC do cliente","C":"Porta UDP 53","D":"Registro DNS MX"}},{"n":106,"q":"Um administrador está analisando o tráfego de uma aplicação web. Ele observa que o cliente estabelece uma conexão TCP/80 com o servidor e envia: GET /usuarios HTTP/1.1 O servidor responde com o código: 404 Not Found O que esse código indica?","options":{"A":"O servidor recusou a conexão porque a porta 80 está bloqueada.","B":"A requisição utilizou o protocolo DNS incorretamente.","C":"O servidor foi encontrado e processou a requisição HTTP, mas o recurso solicitado não foi encontrado.","D":"O cliente não possui endereço IP válido."}},{"n":107,"q":"Um usuário acessa um site bancário utilizando HTTPS. Qual é a porta TCP padrão normalmente utilizada pelo HTTPS?","options":{"A":"TCP 80","B":"TCP 110","C":"TCP 443","D":"TCP 8080"}},{"n":108,"q":"Um usuário acessa https://sistema.empresa.com. O navegador estabelece uma conexão segura antes de transmitir os dados da aplicação. Qual tecnologia é fundamental para fornecer autenticação do servidor e criptografia da comunicação HTTPS?","options":{"A":"DHCP","B":"TLS","C":"DNS","D":"SNMP"}},{"n":109,"q":"Um usuário acessa https://www.exemplo.com e o navegador exibe um cadeado, indicando que a comunicação está protegida. Um administrador afirma: \"Como o site utiliza HTTPS, podemos garantir que o conteúdo do site é legítimo e que o servidor não pode estar comprometido.\" Qual alternativa está correta?","options":{"A":"A afirmação está correta, pois o HTTPS garante que o servidor esteja livre de malware.","B":"A afirmação está correta, pois o certificado digital garante que todo conteúdo apresentado pelo site é confiável.","C":"A afirmação está incorreta, pois HTTPS protege a comunicação e permite autenticação do servidor, mas não garante que o conteúdo do site seja legítimo ou que o servidor esteja livre de comprometimento.","D":"A afirmação está incorreta porque HTTPS apenas criptografa a senha do usuário, mas não o restante da comunicação."}},{"n":110,"q":"Um administrador de redes deseja monitorar switches, roteadores, servidores e impressoras de sua infraestrutura, coletando informações como utilização de CPU, interfaces e tráfego de rede. Qual protocolo é normalmente utilizado para essa finalidade?","options":{"A":"SMTP","B":"SNMP","C":"FTP","D":"DHCP"}},{"n":111,"q":"Um sistema de monitoramento consulta periodicamente um switch para verificar a quantidade de tráfego em suas interfaces. O administrador precisa saber quais portas são normalmente utilizadas pelo SNMP para consultas e para o recebimento de traps. Qual alternativa está correta?","options":{"A":"UDP 53 para consultas e UDP 54 para traps.","B":"TCP 161 para consultas e TCP 162 para traps.","C":"UDP 161 para consultas e UDP 162 para traps.","D":"TCP 20 para consultas e UDP 21 para traps."}},{"n":112,"q":"Uma equipe de monitoramento utiliza SNMP para acompanhar switches. Durante uma falha, o sistema recebe automaticamente uma mensagem informando que uma interface crítica ficou DOWN, sem que o servidor de monitoramento tivesse feito uma consulta naquele momento. Qual mecanismo do SNMP melhor explica esse comportamento?","options":{"A":"Polling via UDP/161.","B":"SNMP Trap enviado pelo dispositivo para o sistema de gerenciamento.","C":"DNS Notification enviado pela porta UDP/53.","D":"DHCP Discover enviado pelo switch para o servidor de gerenciamento."}},{"n":113,"q":"Um administrador precisa permitir comunicação entre um servidor de aplicação e um servidor de diretório utilizando LDAP sem criptografia. Qual porta deve ser liberada?","options":{"A":"TCP 22","B":"TCP 389","C":"TCP 443","D":"TCP 636"}},{"n":114,"q":"Uma empresa utiliza um servidor de diretório para autenticação dos usuários. O administrador verifica que as consultas LDAP estão funcionando, mas as credenciais dos usuários podem ser transmitidas sem criptografia. Qual seria a melhor solução para proteger essa comunicação?","options":{"A":"Substituir LDAP por Telnet na porta 23.","B":"Utilizar LDAPS na porta TCP 636.","C":"Utilizar LDAP na porta TCP 22.","D":"Utilizar DNS na porta UDP 53."}},{"n":115,"q":"Um servidor de aplicação precisa consultar informações de usuários em um serviço de diretório. A conexão TCP com o servidor LDAP está estabelecida na porta 389, porém a aplicação precisa proteger a comunicação utilizando TLS sem necessariamente mudar para uma conexão LDAPS tradicional na porta 636. Qual alternativa descreve corretamente essa situação?","options":{"A":"O LDAP não suporta TLS; é obrigatório utilizar TCP 636.","B":"É possível utilizar StartTLS, iniciando a comunicação LDAP na porta 389 e posteriormente elevando a conexão para TLS.","C":"Deve-se utilizar SSH na porta 22 para encapsular obrigatoriamente o LDAP.","D":"Deve-se utilizar HTTPS na porta 443, pois LDAP utiliza HTTP para transportar as consultas."}},{"n":116,"q":"Um administrador precisa acessar remotamente a área de trabalho de um servidor Windows utilizando Remote Desktop Protocol (RDP). Qual porta é tradicionalmente utilizada pelo RDP?","options":{"A":"TCP 22","B":"TCP 23","C":"TCP 3389","D":"TCP 5900"}},{"n":117,"q":"Um usuário consegue acessar um servidor Windows pela rede, mas ao tentar utilizar o RDP, a conexão não é estabelecida. O administrador verifica que o endereço IP do servidor está correto e que o serviço de RDP está habilitado.Qual das alternativas é uma das primeiras verificações relacionadas à conectividade RDP?","options":{"A":"Verificar se a porta TCP 3389 está permitida no firewall.","B":"Verificar se a porta UDP 53 está liberada.","C":"Verificar se a porta TCP 21 está liberada.","D":"Verificar se a porta UDP 161 está liberada."}},{"n":118,"q":"Um administrador está analisando uma conexão RDP em uma rede moderna. Ele observa tráfego RDP utilizando TCP e UDP na porta 3389. Qual afirmação está correta?","options":{"A":"O uso de UDP indica que o protocolo deixou de ser RDP e passou a ser VNC.","B":"RDP pode utilizar TCP e UDP, permitindo que o transporte aproveite UDP para determinadas características de desempenho, enquanto o TCP continua sendo utilizado para o transporte confiável.","C":"RDP utiliza exclusivamente UDP 3389; TCP 3389 é utilizado somente pelo SSH.","D":"UDP 3389 é utilizado exclusivamente para descoberta do servidor RDP."}},{"n":119,"q":"Uma empresa utiliza VoIP (Voice over IP) para realizar chamadas telefônicas pela rede. Qual protocolo é utilizado para iniciar, estabelecer, modificar e encerrar sessões de comunicação, como chamadas de voz?","options":{"A":"DNS","B":"SIP","C":"DHCP","D":"SNMP"}},{"n":120,"q":"Um administrador está configurando um firewall para permitir chamadas VoIP que utilizam SIP. Qual combinação de portas está normalmente associada ao protocolo SIP?","options":{"A":"TCP/UDP 21","B":"TCP/UDP 22","C":"UDP/TCP 5060 e TCP 5061 para SIP sobre TLS","D":"UDP 3389"}},{"n":121,"q":"Uma empresa possui telefones IP e um servidor VoIP. Durante uma chamada, o administrador captura o tráfego e observa que as mensagens SIP estão sendo utilizadas para estabelecer a chamada, enquanto o áudio é transportado separadamente por outro protocolo. Qual alternativa explica corretamente essa situação?","options":{"A":"SIP transporta obrigatoriamente todo o áudio da chamada; RTP é utilizado apenas para autenticação.","B":"SIP é responsável pela sinalização da sessão, enquanto o RTP normalmente transporta os fluxos de áudio/vídeo em tempo real.","C":"SIP é utilizado exclusivamente para resolver nomes DNS, enquanto RTP estabelece a chamada.","D":"SIP e RTP são protocolos equivalentes e ambos possuem a mesma função de transportar áudio."}},{"n":122,"q":"Um computador precisa enviar um arquivo para apenas um servidor específico na rede. Qual tipo de tráfego está sendo utilizado?","options":{"A":"Broadcast","B":"Multicast","C":"Unicast","D":"Anycast"}},{"n":123,"q":"Um servidor precisa enviar uma grande quantidade de dados para um único computador cliente, identificado por seu endereço IP. Outros computadores da mesma rede não devem receber esse tráfego. Qual tipo de comunicação deve ser utilizado?","options":{"A":"Broadcast","B":"Multicast","C":"Anycast","D":"Unicast"}},{"n":124,"q":"Um administrador captura tráfego entre um computador 192.168.10.20 e um servidor 192.168.10.50. Ele observa que os pacotes possuem como origem 192.168.10.20 e destino 192.168.10.50. Nenhum outro host deve receber intencionalmente esses dados. Qual afirmação está correta?","options":{"A":"É broadcast, pois os dois dispositivos estão na mesma sub-rede.","B":"É multicast, pois o servidor está dentro do mesmo domínio de broadcast.","C":"É unicast, pois existe um único endereço de destino específico.","D":"É anycast, pois o endereço IP de destino pode ser alcançado por roteamento."}},{"n":125,"q":"Uma empresa precisa transmitir uma apresentação em vídeo para um grupo específico de 50 computadores, sem enviar o tráfego para todos os dispositivos da rede. Qual tipo de tráfego é mais adequado?","options":{"A":"Unicast","B":"Broadcast","C":"Multicast","D":"Anycast"}},{"n":126,"q":"Um servidor transmite uma aula ao vivo para 100 computadores. Apenas os computadores que se inscreveram em um determinado grupo multicast devem receber o fluxo. Qual é a principal vantagem do multicast nesse cenário em comparação com o envio de 100 fluxos unicast independentes?","options":{"A":"O multicast elimina completamente a necessidade de roteadores.","B":"O multicast permite que a origem envie um único fluxo para um grupo, reduzindo a duplicação desnecessária do tráfego.","C":"O multicast envia automaticamente o tráfego para todos os dispositivos da rede.","D":"O multicast garante criptografia dos dados transmitidos."}},{"n":127,"q":"Uma empresa utiliza multicast para distribuir vídeo em tempo real. Um computador deseja começar a receber o fluxo multicast, enquanto outro computador deseja deixar de recebê-lo. Qual conceito/protocolo está diretamente relacionado à entrada e saída de hosts de grupos multicast em redes IPv4?","options":{"A":"ARP","B":"DHCP","C":"IGMP","D":"ICMP Redirect"}},{"n":128,"q":"Uma empresa possui vários servidores DNS distribuídos geograficamente, utilizando o mesmo endereço IP anycast. Quando um cliente faz uma solicitação, a rede encaminha o tráfego para um dos servidores disponíveis, normalmente aquele considerado mais próximo pela lógica de roteamento. Qual tipo de tráfego está sendo utilizado?","options":{"A":"Unicast","B":"Multicast","C":"Broadcast","D":"Anycast"}},{"n":129,"q":"Qual situação representa melhor o uso de anycast?","options":{"A":"Um servidor envia um arquivo diretamente para um único computador específico.","B":"Um servidor envia uma transmissão de vídeo para todos os computadores interessados em um grupo multicast.","C":"Um cliente acessa um serviço utilizando um endereço IP que é anunciado por vários servidores, e o roteamento direciona a requisição para um deles.","D":"Um computador envia uma mensagem para todos os dispositivos do seu domínio de broadcast."}},{"n":130,"q":"Uma organização possui três servidores DNS localizados em Brasília, São Paulo e Miami. Todos anunciam o mesmo endereço IP utilizando anycast. Um cliente localizado em Brasília consulta esse endereço. O roteamento determina que o servidor de Brasília é o melhor destino. Posteriormente, devido a uma falha de conectividade, a rota para Brasília deixa de ser preferível e o tráfego passa a ser encaminhado para São Paulo. Qual característica do anycast está sendo demonstrada?","options":{"A":"O cliente utiliza broadcast para descobrir todos os servidores e envia a consulta para todos eles.","B":"O mesmo endereço é anunciado por múltiplos destinos, e o roteamento seleciona um destino com base na melhor rota disponível.","C":"O cliente estabelece simultaneamente uma sessão com todos os servidores que possuem o endereço anycast.","D":"O tráfego é enviado para todos os membros de um grupo multicast e somente um deles responde."}},{"n":131,"q":"Um computador precisa enviar uma mensagem para todos os dispositivos do mesmo domínio de broadcast IPv4. Qual tipo de tráfego deve ser utilizado?","options":{"A":"Unicast","B":"Multicast","C":"Anycast","D":"Broadcast"}},{"n":132,"q":"Um computador está conectado à rede 192.168.10.0/24 e precisa enviar um pacote para todos os hosts dessa sub-rede. Qual endereço IPv4 deve ser utilizado como endereço de broadcast?","options":{"A":"192.168.10.0","B":"192.168.10.1","C":"192.168.10.254","D":"192.168.10.255"}},{"n":133,"q":"Um administrador possui duas redes: • Rede A: 192.168.10.0/24 • Rede B: 192.168.20.0/24 Um computador da Rede A envia um pacote para 192.168.10.255, utilizando broadcast. Um roteador conecta as duas redes. O que acontecerá com esse pacote?","options":{"A":"O roteador encaminhará o broadcast automaticamente para a Rede B.","B":"O broadcast será convertido automaticamente em multicast pelo roteador.","C":"O broadcast ficará restrito ao domínio de broadcast da Rede A e, normalmente, não será encaminhado pelo roteador para a Rede B.","D":"O roteador enviará o broadcast somente para o servidor DHCP da Rede B."}},{"n":134,"q":"Uma empresa deseja conectar notebooks, smartphones e tablets à rede corporativa sem utilizar cabos Ethernet. Qual tecnologia é utilizada para fornecer essa conectividade sem fio?","options":{"A":"802.11","B":"802.3","C":"Fibre Channel","D":"DOCSIS"}},{"n":135,"q":"Um administrador precisa melhorar a cobertura Wi-Fi de um escritório. Ele instala um Access Point (AP) conectado à rede cabeada e configura uma rede sem fio para os usuários. Qual afirmação descreve corretamente o funcionamento dessa solução?","options":{"A":"O AP converte obrigatoriamente todo tráfego Wi-Fi em sinais de fibra óptica.","B":"O AP permite que dispositivos sem fio se comuniquem com a rede, utilizando rádio para a comunicação entre clientes e o AP.","C":"O AP funciona exclusivamente como um roteador de Internet e não pode fazer parte de uma rede corporativa existente.","D":"O AP utiliza exclusivamente cabos coaxiais para transmitir os dados aos dispositivos sem fio."}},{"n":136,"q":"Uma empresa possui uma rede Wi-Fi com muitos dispositivos conectados. O administrador percebe que determinados clientes apresentam baixo desempenho quando estão distantes do Access Point. Ele decide avaliar a utilização de diferentes bandas do padrão 802.11. Qual afirmação é a mais correta?","options":{"A":"A banda de 2,4 GHz geralmente oferece maior alcance e melhor capacidade de atravessar obstáculos, porém possui menos canais não sobrepostos e pode sofrer mais interferência.","B":"A banda de 5 GHz sempre possui maior alcance que 2,4 GHz e atravessa paredes com mais facilidade.","C":"A banda de 2,4 GHz não sofre interferência de outros dispositivos porque é exclusiva para Wi-Fi.","D":"Quanto maior a frequência utilizada pelo Wi-Fi, maior será obrigatoriamente o alcance do sinal."}},{"n":137,"q":"Um usuário está viajando e acessa a Internet pelo smartphone enquanto se desloca entre diferentes regiões da cidade, sem utilizar Wi-Fi. Qual tecnologia de transmissão está sendo utilizada?","options":{"A":"Coaxial","B":"Cellular","C":"DAC","D":"Fibre Channel"}},{"n":138,"q":"Um usuário está fazendo uma chamada de vídeo enquanto dirige. Durante o deslocamento, o smartphone sai da área de cobertura de uma estação rádio-base e entra na área de outra, mas a conexão continua funcionando. Qual mecanismo permite essa continuidade da comunicação?","options":{"A":"Roaming/handoff entre células","B":"Broadcast","C":"NAT","D":"CSMA/CD"}},{"n":139,"q":"Uma empresa precisa fornecer conectividade para dispositivos IoT espalhados por uma área muito grande, onde não existe infraestrutura Wi-Fi disponível. Os dispositivos precisam funcionar com mobilidade e devem se conectar à rede mesmo quando mudam de área de cobertura. Qual característica das redes cellular torna essa tecnologia adequada para esse cenário?","options":{"A":"Os dispositivos precisam permanecer conectados fisicamente a um switch Ethernet.","B":"A rede utiliza células de cobertura e permite mobilidade entre diferentes estações rádio-base, possibilitando conectividade em áreas amplas.","C":"A comunicação depende exclusivamente de um único Access Point central.","D":"A rede celular funciona somente quando os dispositivos estão dentro de uma única sub-rede IP."}},{"n":140,"q":"Uma empresa precisa fornecer acesso à Internet para uma região rural onde não existe infraestrutura de fibra óptica, cabo ou rede celular disponível. Qual meio de transmissão sem fio pode ser utilizado?","options":{"A":"DAC","B":"Coaxial","C":"Satélite","D":"Fibre Channel"}},{"n":141,"q":"Um usuário utiliza Internet via satélite e percebe que há um atraso perceptível entre enviar uma solicitação e receber a resposta. Qual característica da comunicação via satélite pode explicar esse comportamento?","options":{"A":"A utilização obrigatória de cabos coaxiais entre todos os dispositivos.","B":"A distância percorrida pelo sinal até o satélite e de volta, especialmente em sistemas que utilizam satélites em órbita geoestacionária.","C":"A ausência de qualquer comunicação por rádio.","D":"O fato de o satélite funcionar exclusivamente na camada física e não transmitir dados."}},{"n":142,"q":"Uma organização precisa escolher entre uma solução de Internet via satélite GEO e uma solução via satélite LEO para aplicações interativas, como videoconferência e acesso a sistemas corporativos em tempo real. Qual afirmação é mais adequada?","options":{"A":"GEO normalmente apresenta menor latência que LEO porque está mais distante da Terra.","B":"LEO tende a oferecer menor latência que GEO devido à menor altitude orbital, embora normalmente exija uma constelação de muitos satélites para proporcionar cobertura contínua.","C":"LEO não pode fornecer acesso à Internet, pois somente satélites GEO conseguem transmitir dados.","D":"GEO e LEO possuem necessariamente a mesma latência porque utilizam ondas de rádio."}},{"n":143,"q":"Uma empresa precisa conectar dois prédios separados por vários quilômetros. O ambiente possui muitos equipamentos elétricos e há preocupação com interferência eletromagnética (EMI). Qual meio de transmissão é mais adequado?","options":{"A":"Cabo coaxial","B":"Fibra óptica","C":"Cabo DAC","D":"Cabo de par trançado UTP"}},{"n":144,"q":"Um administrador precisa escolher entre Single-Mode Fiber (SMF) e Multi-Mode Fiber (MMF) para conectar equipamentos dentro de um Data Center. Qual afirmação está correta?","options":{"A":"MMF é normalmente utilizada para distâncias muito maiores que SMF.","B":"SMF utiliza um núcleo menor e é mais adequada para longas distâncias, enquanto MMF é mais comum em distâncias menores, como dentro de Data Centers.","C":"SMF utiliza sinais elétricos e MMF utiliza sinais ópticos.","D":"MMF é imune à EMI, enquanto SMF é afetada por interferência eletromagnética."}},{"n":145,"q":"Uma empresa possui um enlace de fibra óptica entre dois prédios. Após uma obra, o enlace começou a apresentar perda de sinal. O técnico descobre que o cabo foi dobrado excessivamente em um ponto próximo ao caminho da instalação. Qual problema físico da fibra pode estar causando essa perda?","options":{"A":"Crosstalk elétrico entre os pares trançados.","B":"Reflexão e atenuação causadas por uma curvatura excessiva da fibra, podendo ocorrer bend loss.","C":"Colisão causada pelo protocolo CSMA/CD.","D":"Interferência eletromagnética causada pelos equipamentos elétricos próximos."}},{"n":146,"q":"Qual das alternativas descreve corretamente um cabo coaxial (coaxial cable)?","options":{"A":"Utiliza pulsos de luz para transmitir dados.","B":"Possui um condutor central, material isolante, blindagem metálica e uma capa externa.","C":"É composto por vários pares de fios de cobre trançados.","D":"É utilizado exclusivamente para conexões entre servidores e switches em Data Centers."}},{"n":147,"q":"Um provedor de Internet utiliza a infraestrutura de TV a cabo existente para fornecer acesso à Internet aos clientes. Qual meio de transmissão é normalmente utilizado nesse tipo de infraestrutura?","options":{"A":"Fibra óptica exclusivamente","B":"Cabo coaxial","C":"DAC","D":"Cabo de fibra multimodo exclusivamente"}},{"n":148,"q":"Um técnico precisa escolher entre coaxial, fibra óptica e par trançado para uma instalação. O ambiente possui equipamentos elétricos próximos e exige alta capacidade e transmissão em longa distância. Qual característica torna a fibra óptica mais adequada que o coaxial nesse cenário?","options":{"A":"A fibra utiliza um condutor central de cobre mais espesso.","B":"A fibra utiliza sinais ópticos e, portanto, é imune à interferência eletromagnética (EMI), além de oferecer excelente capacidade e alcance.","C":"O coaxial não possui blindagem e por isso sempre sofre interferência eletromagnética.","D":"O coaxial transmite dados utilizando luz, enquanto a fibra utiliza sinais elétricos."}},{"n":149,"q":"Um administrador precisa conectar um servidor diretamente a um switch localizado no mesmo rack do Data Center, utilizando um cabo de alta velocidade e curta distância. Qual meio de transmissão é mais adequado?","options":{"A":"Cabo coaxial","B":"Fibra óptica de longa distância","C":"DAC (Direct Attach Copper)","D":"Satélite"}},{"n":150,"q":"Um Data Center possui servidores com interfaces de 25 Gb/s e switches compatíveis com DAC. O administrador quer reduzir custos e evitar módulos ópticos para conexões entre equipamentos que estão próximos. Qual é uma vantagem típica do DAC nessa situação?","options":{"A":"Permite conexões de milhares de quilômetros sem repetidores.","B":"Normalmente possui menor custo e menor complexidade para conexões de curta distância em comparação com soluções ópticas equivalentes.","C":"É imune a qualquer tipo de interferência eletromagnética.","D":"Utiliza luz para transmitir os dados entre os equipamentos."}},{"n":151,"q":"Um administrador precisa conectar dois switches que estão separados por aproximadamente 100 metros dentro do Data Center. Ele considera utilizar um cabo DAC, mas também avalia fibra óptica. Qual é a principal consideração que deve ser feita antes de escolher o DAC?","options":{"A":"DAC sempre suporta qualquer distância sem perda de desempenho.","B":"DAC é projetado principalmente para distâncias curtas; para distâncias maiores, uma solução óptica pode ser mais adequada, dependendo da especificação do equipamento e do transceptor.","C":"DAC só pode ser utilizado para conexões de 1 Gb/s.","D":"DAC utiliza sinais ópticos e, portanto, exige necessariamente um transceptor de fibra em cada extremidade."}},{"n":152,"q":"Um técnico precisa conectar um cabo de fibra óptica utilizando um conector SC. Qual característica é típica desse conector?","options":{"A":"Conector pequeno com mecanismo de trava (latch), utilizado para alta densidade.","B":"Conector com formato quadrado e mecanismo push-pull, comum em instalações de fibra óptica.","C":"Conector roscado utilizado principalmente em cabos coaxiais.","D":"Conector utilizado exclusivamente em cabos de par trançado Ethernet."}},{"n":153,"q":"Um técnico encontra dois conectores de fibra óptica em um Data Center. O primeiro é relativamente grande e quadrado, com mecanismo de encaixe push-pull. O segundo é menor e utiliza uma pequena trava (latch). Quais são, respectivamente, os conectores?","options":{"A":"SC e LC","B":"LC e SC","C":"ST e MPO","D":"MPO e SC"}},{"n":154,"q":"Um administrador precisa especificar conectores para um enlace de fibra óptica em uma instalação onde facilidade de conexão/desconexão e robustez são importantes. O projeto exige um conector de fibra com mecanismo push-pull, enquanto outro projeto, no mesmo Data Center, prioriza alta densidade. Qual combinação atende melhor aos requisitos?","options":{"A":"SC para push-pull e LC para alta densidade.","B":"SC para alta densidade e RJ45 para fibra.","C":"LC para push-pull e SC para alta densidade.","D":"BNC para push-pull e SC para cabo coaxial."}},{"n":155,"q":"Um técnico precisa conectar um cabo de fibra óptica em um Data Center onde há grande quantidade de conexões em pouco espaço. Qual conector é conhecido por seu tamanho pequeno e por ser adequado para instalações de alta densidade?","options":{"A":"RJ45","B":"BNC","C":"LC","D":"RJ11"}},{"n":156,"q":"Um administrador encontra dois conectores de fibra óptica: • Conector A: maior, formato quadrado e mecanismo push-pull. • Conector B: menor, com mecanismo de trava (latch). Quais são os conectores A e B, respectivamente?","options":{"A":"LC e SC","B":"SC e LC","C":"ST e LC","D":"MPO e SC"}},{"n":157,"q":"Um Data Center precisa aumentar significativamente a quantidade de enlaces de fibra óptica dentro de um rack, mas o espaço disponível para os conectores é limitado. O administrador compara SC e LC. Qual característica do LC explica melhor sua escolha?","options":{"A":"O LC utiliza um conector maior, permitindo maior potência óptica.","B":"O LC possui formato menor e mecanismo de trava, permitindo maior densidade de conexões em painéis e equipamentos.","C":"O LC utiliza sinais elétricos em vez de sinais ópticos.","D":"O LC foi desenvolvido para cabos coaxiais e utiliza blindagem metálica."}},{"n":158,"q":"Qual característica é mais associada ao conector ST (Straight Tip)?","options":{"A":"Conector de fibra óptica pequeno, com trava tipo latch, usado em alta densidade","B":"Conector de fibra óptica com mecanismo de encaixe tipo baioneta (twist-lock)","C":"Conector de cobre usado principalmente em redes Ethernet","D":"Conector coaxial rosqueado usado em TV a cabo"}},{"n":159,"q":"Um técnico encontra em um equipamento de rede um conector de fibra óptica relativamente antigo, com formato cilíndrico e mecanismo de travamento por giro (twist-lock). Qual conector ele provavelmente encontrou?","options":{"A":"LC","B":"SC","C":"ST","D":"RJ45"}},{"n":160,"q":"Durante a manutenção de uma infraestrutura de rede antiga, o técnico precisa substituir um conector de fibra óptica. O conector existente possui corpo cilíndrico, utiliza mecanismo de baioneta e não é adequado para instalações modernas de alta densidade. Qual alternativa identifica corretamente o conector e sua principal característica?","options":{"A":"LC — pequeno e utiliza mecanismo de trava (latch), sendo adequado para alta densidade","B":"SC — utiliza encaixe push-pull e possui corpo geralmente quadrado","C":"ST — utiliza encaixe por baioneta e é encontrado principalmente em instalações mais antigas","D":"MPO — utiliza múltiplas fibras em um único conector e é o padrão descrito"}},{"n":161,"q":"Qual é a principal característica do conector MPO?","options":{"A":"É utilizado exclusivamente em cabos telefônicos","B":"É um conector de fibra óptica que pode acomodar várias fibras em um único conector","C":"É um conector coaxial utilizado para televisão","D":"É um conector de par trançado utilizado em redes Ethernet"}},{"n":162,"q":"Um Data Center precisa aumentar a densidade das conexões de fibra óptica entre seus switches, reduzindo a quantidade de conectores e cabos individuais. Qual conector seria mais apropriado?","options":{"A":"RJ11","B":"BNC","C":"MPO","D":"
